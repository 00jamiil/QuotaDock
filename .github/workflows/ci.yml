name: CI

on:
  push:
  pull_request:

jobs:
  build-test-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore QuotaDock.slnx -p:Platform=x64
      - name: Build native app
        run: dotnet build src/QuotaDock.App/QuotaDock.App.csproj -c Release -p:Platform=x64 --no-restore
      - name: Test core
        run: dotnet test tests/QuotaDock.Core.Tests/QuotaDock.Core.Tests.csproj -c Release --no-restore --settings coverlet.runsettings --collect:"XPlat Code Coverage"
      - name: Test connectors
        run: dotnet test tests/QuotaDock.Connectors.Tests/QuotaDock.Connectors.Tests.csproj -c Release --no-restore --settings coverlet.runsettings --collect:"XPlat Code Coverage"
      - name: Test infrastructure
        run: dotnet test tests/QuotaDock.Infrastructure.Tests/QuotaDock.Infrastructure.Tests.csproj -c Release --no-restore --settings coverlet.runsettings --collect:"XPlat Code Coverage"
      - name: Dependency audit
        run: dotnet list QuotaDock.slnx package --vulnerable --include-transitive
      - name: Package alpha
        shell: powershell
        run: ./scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaDock-alpha-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.msix
